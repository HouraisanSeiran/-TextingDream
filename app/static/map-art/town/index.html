<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>织梦 · 城镇建筑美术总览</title>
<style>
body{margin:0;font:13px/1.5 "Microsoft YaHei",sans-serif;background:#ece3cc;color:#3a2c1e}
header{padding:12px 18px;background:#3a2c1e;color:#efdfb2}
header h1{margin:0;font-size:18px}
.bar{display:flex;gap:14px;align-items:center;padding:10px 18px;flex-wrap:wrap;background:#e1d5ba;border-bottom:1px solid #c9b994}
.bar select,.bar input{font:inherit}
section{padding:12px 18px}
h2{font-size:15px;margin:6px 0 10px;border-bottom:1px solid #c9b994}
#scene svg{background:#c9c79a;border:1px solid #b8a985;max-width:100%;height:auto}
#atlas{display:flex;flex-wrap:wrap;gap:8px}
.card{background:#f3ead4;border:1px solid #d3c5a6;padding:6px;text-align:center;font-size:11px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end}
.card b{font-size:12px}
.card code{color:#7a6a50;font-size:10px}
#count{color:#6b4f32}
</style>
</head>
<body>
<header><h1>城镇建筑美术总览</h1>
<div>3/4 斜俯视 · 48 px 网格 · 双网格道路与城墙。现有 23 目录、1606 个 symbol，由 <code>node build-index.js</code> 汇总。真实草稿与版本布局请到服务首页「城镇创作」；此页为素材图册。</div></header>

<div class="bar">
  <label>示范城镇风格 <select id="set">
    <option value="west">西式奇幻</option><option value="east">东方玄幻</option>
    <option value="arab">阿拉伯</option>
    <option value="elf">精灵</option><option value="dwarf">矮人</option><option value="orc">兽人</option></select></label>
  <label>种子 <input id="seed" type="number" value="7" style="width:70px"></label>
  <span style="width:20px"></span>
  <label>图册：风格 <select id="fs"><option value="">全部</option><option value="west">西式</option><option value="east">东方</option><option value="arab">阿拉伯</option></select></label>
  <label>种族 <select id="fr"><option value="">全部</option><option>common</option><option>elf</option><option>dwarf</option><option>orc</option></select></label>
  <label>类别 <select id="fc"><option value="">全部</option><option>house</option><option>special</option><option>landmark</option><option>site</option><option>fort</option><option>castle</option><option>prop</option><option>wall</option><option>road</option><option>water</option><option>ground</option></select></label>
  <label>资源 <select id="fx"><option value="">全部</option></select></label>
  <label>搜索 <input id="fq" placeholder="id 或中文名" style="width:140px"></label>
  <span id="count"></span>
</div>

<section><h2>各目录预览页（资源点小地图、拼接验证、示意场景都在这里）</h2><div id="dirs" style="display:flex;flex-wrap:wrap;gap:6px"></div></section>

<section><h2>示范城镇（城墙 + 城门 + 角楼 + 十字主街 + 建筑按锚点 y 排序）</h2><div id="scene"></div></section>
<section><h2>图册</h2><div id="atlas"></div></section>

<div id="zoom" style="display:none;position:fixed;inset:0;background:rgba(40,30,20,.72);z-index:9;align-items:center;justify-content:center;flex-direction:column;cursor:zoom-out"><div id="zbox" style="background:#f3ead4;padding:16px;max-width:92vw;max-height:88vh;overflow:auto"></div></div>
<script src="town-catalog.js"></script>
<script src="index.js"></script>
</body>
</html>
