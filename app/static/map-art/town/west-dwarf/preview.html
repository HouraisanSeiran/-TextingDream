<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>织梦 · 城镇矮人族素材预览</title>
<style>
  body { margin: 0; background: #c9c79a; font: 13px/1.4 "Microsoft YaHei", sans-serif; color: #4a3826; }
  h2 { margin: 18px 16px 6px; font-size: 16px; }
  .grid { display: flex; flex-wrap: wrap; gap: 10px; padding: 0 16px; align-items: flex-end; }
  .card { background: rgba(239,223,178,0.35); border: 1px solid rgba(74,56,38,0.25); padding: 6px; text-align: center; }
  .card svg { display: block; margin: 0 auto; }
  .lab { font-size: 11px; margin-top: 2px; white-space: nowrap; }
  .lab b { font-weight: 600; }
  .scene { padding: 0 16px 24px; }
  .note { margin: 0 16px; font-size: 12px; opacity: 0.8; }
</style>
</head>
<body>
<!-- sprite 容器不能 display:none（clipPath 会失效），用 0×0 绝对定位 -->
<div id="sprite-host" style="position:absolute;left:0;top:0;width:0;height:0;overflow:hidden"></div>
<h2>矮人聚落示意（按锚点 y 排序绘制）</h2>
<div id="scene" class="scene"></div>
<h2>民居图册（锚点 = 红点，占地 = 虚线框）</h2>
<div id="houses" class="grid"></div>
<h2>特殊建筑</h2>
<div id="specials" class="grid"></div>
<h2>城墙瓦片 16 张 + 城门 / 塔</h2>
<div id="tiles" class="grid"></div>
<script src="core.js"></script>
<script src="parts.js"></script>
<script src="houses-a.js"></script>
<script src="houses-b.js" onerror="void 0"></script>
<script src="houses-c.js" onerror="void 0"></script>
<script src="civic-a.js" onerror="void 0"></script>
<script src="civic-b.js" onerror="void 0"></script>
<script src="tiles.js" onerror="void 0"></script>
<script src="west-dwarf.js"></script>
<script src="preview-scene.js" onerror="void 0"></script>
<script>
(function () {
  'use strict';
  var WD = window.TownArt_westDwarf, NS = 'http://www.w3.org/2000/svg', SC = 1.5;
  var all = WD.symbols();
  window.__WD_SYMBOLS = all;
  document.getElementById('sprite-host').innerHTML = WD.spriteSVG(all);
  function useSVG(sym, sc, frame) {
    var vb = sym.viewBox, W = vb[2], H = vb[3], m = 8;
    var s = '<svg xmlns="' + NS + '" width="' + (W + 2 * m) * sc + '" height="' + (H + 2 * m) * sc + '" viewBox="' + (-m) + ' ' + (-m) + ' ' + (W + 2 * m) + ' ' + (H + 2 * m) + '">';
    if (frame) {
      var D = sym.meta.footprint[1] * 48;
      s += '<rect x="0" y="' + (H - D) + '" width="' + W + '" height="' + D + '" fill="#b9b78a" fill-opacity="0.45" stroke="#4a3826" stroke-opacity="0.35" stroke-dasharray="3 2"/>';
    }
    s += '<use href="#' + sym.id + '" x="0" y="0" width="' + W + '" height="' + H + '"/>';
    if (frame) s += '<circle cx="' + sym.meta.anchor[0] + '" cy="' + sym.meta.anchor[1] + '" r="1.8" fill="#c0392b"/>';
    return s + '</svg>';
  }
  function cards(el, filter, sc) {
    var html = '';
    all.filter(filter).forEach(function (s) {
      var m = s.meta;
      html += '<div class="card">' + useSVG(s, sc || SC, true) + '<div class="lab"><b>' + m.name + '</b> ' + m.footprint.join('×') +
        '</div><div class="lab">' + m.id + '</div></div>';
    });
    document.getElementById(el).innerHTML = html;
  }
  cards('houses', function (s) { return s.meta.category === 'house'; });
  cards('specials', function (s) { return s.meta.category === 'special' || s.meta.category === 'prop'; });
  cards('tiles', function (s) { return s.meta.category === 'wall'; }, 1.25);
  if (window.TownArtWD_scene) window.TownArtWD_scene.render(WD, document.getElementById('scene'));
})();
</script>
</body>
</html>
