 <circle cx="30" cy="50" r="22" fill="#f2ead6" fill-opacity=".85" stroke-width="1.4"/>
 <circle cx="30" cy="50" r="17.5" fill="none" stroke-width=".6" stroke-dasharray="2 2.6"/>
 <path d="M30 8 L35 46 L30 52 L25 46 Z" fill="#24231f" stroke-width="1"/>
 <path d="M30 8 L30 52 L25 46 Z" fill="#6d6a60" stroke="none"/>
 <path d="M30 92 L34 54 L30 52 L26 54 Z" fill="none" stroke-width=".9" transform="translate(0,-14)"/>
 <circle cx="30" cy="50" r="2.6" fill="#b3261e" stroke="none"/>
</g></symbol>

<!-- ======================= 装饰 · 祥云 ======================= -->
<symbol id="east-cloud" viewBox="0 0 100 44"><g stroke="#3d4a4a" stroke-linecap="round" stroke-linejoin="round">
