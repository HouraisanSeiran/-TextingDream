<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="0" height="0" style="position:absolute">
<!-- 织梦 · 东方风格制图装饰（不表示数据）。本工程原创，供 app/map_render.py 的 eastern 风格使用；图示（城市/资源/道路）在 map-art-eastern.svg。
     east-seal 100×100（印框，印文由使用方叠加）；east-north 60×80（指北，字由使用方叠加）；east-cloud 100×44（祥云）。 -->
<defs>

<!-- ======================= 装饰 · 朱印（印框；印文由使用方叠加） ======================= -->
<symbol id="east-seal" viewBox="0 0 100 100">
