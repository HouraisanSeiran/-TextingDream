 <path d="M12 33 C18 31 26 34 34 32 C42 30 50 34 58 32 C66 30 74 34 80 32" fill="none" stroke-width=".8" stroke-opacity=".6"/>
 <path d="M92 40 C96 41 99 39 98 36 M3 40 C1 38 2 35 5 35" fill="none" stroke-width=".8"/>
</g></symbol>

</defs>
</svg>
